# Environment of the SenFinder wrapper. R and the six packages are the versions that the README of the
# SenFinder repository states. kernlab holds the class of the released model; the README does not list it, and
# 0.9_33 is the version that was current when the model was released (December 2024). jsonlite writes
# run_info.json. The exact builds of all packages are in conda_explicit_lock.txt.
name: senfinder
channels:
  - conda-forge
dependencies:
  - r-base=4.4.1
  - r-dplyr=1.1.4
  - r-tidyr=1.3.1
  - r-ggplot2=3.5.1
  - r-lattice=0.22_6
  - r-caret=6.0_94
  - r-e1071=1.7_14
  - r-kernlab=0.9_33
  - r-jsonlite=1.8.9
